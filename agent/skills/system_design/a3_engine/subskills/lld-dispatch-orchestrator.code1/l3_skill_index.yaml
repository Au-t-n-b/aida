    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  计算管存面互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  计算样本面互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  计算参数面互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  存储管理面互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  存储业务面互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  存储样本面互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  SPINE上行互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan
    default_layer: l2

  # --- 接入规划：从已有 A3网络设备接入规划.xlsx 按平面导出（需先完成地址规划）---
  计算带外管理接入规划:
    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  存储带外管理接入规划:
    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  网络带外管理接入规划:
    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  灵衢带外管理接入规划:
    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  带外管理面接入规划:
