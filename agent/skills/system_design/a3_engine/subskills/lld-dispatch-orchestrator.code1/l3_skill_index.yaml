# 三级基命令 -> agent-skill_full1（与 intent-taxonomy.md 对齐）

version: "0.2"

skills:
  # --- 带外管理地址规划 ---
  计算带外管理地址规划:
    package: ../a3-dw-manage-ip-workflow.code1
    entrypoint: scripts/offline_dw_manage_pipeline.py
    args_style: dw_007
    default_sheet: 计算带外管理面端口互联

  存储带外管理地址规划:
    package: ../a3-storage-dw-manage-ip-workflow.code1
    entrypoint: scripts/offline_storage_dw_manage_pipeline.py
    args_style: dw_007
    default_sheet: 存储带外管理面端口互联

  网络带外管理地址规划:
    package: ../a3-net-dw-manage-ip-workflow.code1
    entrypoint: scripts/offline_net_dw_manage_pipeline.py
    args_style: dw_007
    default_sheet: 网络带外管理面端口互联

  灵衢带外管理地址规划:
    package: ../a3-lq-dw-manage-ip-workflow.code1
    entrypoint: scripts/offline_lq_dw_manage_pipeline.py
    args_style: dw_007
    default_sheet: 灵衢带外管理面端口互联

  # --- 管理/管存/业务/样本/参数/超平面 地址 ---
  计算管理面地址规划:
    package: ../a3-l2-l3-ip-workflow.code1
    entrypoint: scripts/offline_l2_l3_ip_pipeline.py
    args_style: l2l3_sheet
    default_sheet: 计算管理面端口互联

  存储管理面地址规划:
    package: ../a3-cc-glm-ip-workflow.code1
    entrypoint: scripts/offline_cc_glm_pipeline.py
    args_style: connect_resource
    default_sheet: 存储管理面端口互联

  计算管存面地址规划:
    package: ../a3-gcm-ip-workflow.code1
    entrypoint: scripts/offline_gcm_pipeline.py
    args_style: gcm
    default_network_plane: 计算管存面
    default_sheet: 计算管存面端口互联

  计算业务面地址规划:
    package: ../a3-ywm-ip-workflow.code1
    entrypoint: scripts/offline_ywm_pipeline.py
    args_style: connect_resource
    default_sheet: 计算业务面端口互联

  存储业务面地址规划:
    package: ../a3-cc-ywm-ip-workflow.code1
    entrypoint: scripts/offline_cc_ywm_pipeline.py
    args_style: connect_resource
    default_sheet: 存储业务面端口互联

  计算参数面地址规划:
    package: ../a3-csm-ip-workflow.code1
    entrypoint: scripts/offline_csm_pipeline.py
    args_style: connect_resource
    default_sheet: 参数面端口互联

  计算超平面地址规划:
    package: ../a3-cpm-lq-ip-workflow.code1
    entrypoint: scripts/offline_cpm_lq_ip_pipeline.py
    args_style: connect_resource
    default_sheet: 超平面端口互联

  计算样本面地址规划:
    package: ../a3-ybm-ip-workflow.code1
    entrypoint: scripts/ybm_offline_pipeline.py
    args_style: connect_resource
    default_sheet: 存储面端口互联 | 样本面端口互联

  存储样本面地址规划:
    package: ../a3-cc-ybm-ip-workflow.code1
    entrypoint: scripts/offline_cc_ybm_pipeline.py
    args_style: connect_resource
    default_sheet: 样本面端口互联 | 数据面端口互联

  网络业务地址规划:
    package: ../a3-gcm-ip-workflow.code1
    entrypoint: scripts/offline_gcm_pipeline.py
    args_style: gcm
    default_network_plane: 其它
    default_sheet: 其它

  # --- 互联规划（oob 覆盖 LEAF-SPINE / 带外等）---
  计算带外管理互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
    args_style: oob_plan

  存储带外管理互联规划:
    package: ../oob-interconnect-workflow.code1
    entrypoint: scripts/run_oob_interconnect.py
