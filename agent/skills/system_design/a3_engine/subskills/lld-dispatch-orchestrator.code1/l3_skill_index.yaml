    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  存储业务面接入规划:
    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  存储样本面接入规划:
    package: ../net-dw-access-ip-workflow.code1
    entrypoint: scripts/run_network_access_plan.py
    args_style: access_query
    requires_access_plan: true

  # --- 路由 / LLD / ZTP / 检查 ---
  网络设备ASN规划:
    package: ../a3-switch-asn-workflow.code1
    entrypoint: scripts/offline_switch_asn_pipeline.py
    args_style: connect_resource

  生成完整LLD设计:
    package: ../a3_LLD_generate_code1
    entrypoint: scripts/offline_lld_generate_pipeline.py
    args_style: lld_generate
    lld_mode: plan

  融合完整LLD设计:
    package: ../a3_LLD_generate_code1
    entrypoint: scripts/offline_lld_generate_pipeline.py
    args_style: lld_generate
    lld_mode: integrate

  生成ZTP设计文件:
    package: ../a3-generate-ztp-lld-workflow.code1
    entrypoint: scripts/offline_generate_ztp_lld_pipeline.py
    args_style: ztp_scan

  生成ZTP配置文件:
    package: ../a3-generate-ztp-cfg-workflow.code1
    entrypoint: scripts/offline_generate_ztp_cfg_pipeline.py
    args_style: ztp_scan

  生成灵衢开局文件:
    package: ../a3-generate-lq-open-workflow.code1
    entrypoint: scripts/offline_generate_lq_open_pipeline.py
    args_style: lq_open_scan

  检查输入件是否妥当:
    package: ../a3-input-components-workflow.code1
    entrypoint: scripts/offline_input_components_pipeline.py
    args_style: input_check

  # --- 网管 direct（二级即三级）---
  CCAE规划:
    package: ../ccae-planner.code1
    entrypoint: scripts/run_ccae_planner.py
    args_style: planner

  DME规划:
    package: ../dme-planning.code1
    entrypoint: scripts/generate_dme_plan.py
    args_style: planner

  NCE规划:
    package: ../nce-planner.code1
    entrypoint: scripts/run_nce_planner.py
    args_style: planner

  交换机MLAG规划:
    package: ../switch-mlag-planning-workflow.code1
    entrypoint: scripts/run_switch_mlag.py
    args_style: mlag

  # --- 设备命名（五条 L2，一指令一子命令）---
  生成设备清单:
    package: ../a3-device-naming-workflow.code1
    entrypoint: scripts/offline_device_naming_pipeline.py
    args_style: device_naming
    naming_subcommand: generate-list

  替换设备名称:
    package: ../a3-device-naming-workflow.code1
    entrypoint: scripts/offline_device_naming_pipeline.py
    args_style: device_naming
    naming_subcommand: replace-lld

  ZTP名称替换:
    package: ../a3-device-naming-workflow.code1
    entrypoint: scripts/offline_device_naming_pipeline.py
    args_style: device_naming
    naming_subcommand: replace-ztp

  ZTP名称替换_L1:
    package: ../a3-device-naming-workflow.code1
    entrypoint: scripts/offline_device_naming_pipeline.py
    args_style: device_naming
    naming_subcommand: replace-ztp-l1

  ZTP名称替换_L2:
    package: ../a3-device-naming-workflow.code1
    entrypoint: scripts/offline_device_naming_pipeline.py
    args_style: device_naming
    naming_subcommand: replace-ztp-l2

  # --- 无离线执行器 ---
  网络地址规划知识:
    unsupported: true
    note: "知识问答，非规划 workflow"

  防火墙互联规划:
    unsupported: true
    note: "线上为占位实现，暂无稳定 offline skill"
