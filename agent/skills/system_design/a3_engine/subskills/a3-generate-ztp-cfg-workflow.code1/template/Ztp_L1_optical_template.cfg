  peer ext0 unnumbered-interface 400GHL1/1/6:1
  peer ext0 unnumbered-interface 400GHL1/1/6:2
  peer ext0 unnumbered-interface 400GHL1/1/7:1
  peer ext0 unnumbered-interface 400GHL1/1/7:2
  peer ext0 unnumbered-interface 400GHL1/1/8:1
  peer ext0 unnumbered-interface 400GHL1/1/8:2
  peer ext0 tracking
 #
 ipv4-family vpn-instance ub-instance-0
  maximum load-balancing ebgp 128
  load-balancing as-path-ignore
  import-route op-route
  peer ext0 enable
