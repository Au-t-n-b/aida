#1、配置设备基本信息。
#version 1.5.0
#配置设备名称
sysname {{DeviceName}}
#配置设备时区为东八区
clock timezone Beijing add 08:00:00
#配置带外口使用的VPN
ip vpn-instance NET-manage
 description NET-manage
 ipv4-family
#配置设备管理口地址，全网唯一
interface MEth0/0/0
 ip binding vpn-instance NET-manage
 ip address {{MngIp}} {{subMask}}
#带外VPN使用默认路由指向带外网关
ip route-static vpn-instance NET-manage 0.0.0.0 0.0.0.0 {{MngIpGateWay}}
#配置BMC管理网口
#### bmc begin
ip vpn-instance _inner_management_vpn_
 ipv4-family
interface MEth0/0/1
 ip binding vpn-instance _inner_management_vpn_
 ip address 192.168.0.1 255.255.255.0
#### bmc end
#配置设备作为SFTP客户端时使用的源端口为带外口，控制器配置管理及南向一致性依赖此配置
sftp client-source -i MEth0/0/0
#关闭Telnet服务
telnet server disable
telnet ipv6 server disable
#设置优先告警
set system forwarding-engine alarm-first
#设置配置文件自动保存时间
configuration file auto-save interval 1440
#网络设备作为NTP客户端，关闭NTP server端功能(先不配置认证)
#### ntp begin
ntp server disable
ntp ipv6 server disable
ntp authentication enable
ntp authentication-keyid {{NtpAuthenKtyId}} authentication-mode {{NtpAuthenMode}} cipher {{NtpAuthenPassword}}
ntp trusted authentication-keyid {{NtpAuthenKtyId}}
ntp source-interface MEth0/0/0 vpn-instance NET-manage
ntp unicast-server {{NtpServerIp}} vpn-instance NET-manage preferred
ntp unicast-server {{NtpServerIpBack}} vpn-instance NET-manage
ntp unicast-server domain {{NtpServerDomain}}
#### ntp end
#
aaa
 #### user account begin
 local-user {{sshLocalUser}} password irreversible-cipher {{sshLocalUserPassword}}
 local-user {{sshLocalUser}} service-type terminal ssh
 local-user {{sshLocalUser}} level 3
 local-user {{netconfUser}} password irreversible-cipher {{netconfUserPassword}}
 local-user {{netconfUser}} service-type ssh
 local-user {{netconfUser}} level 3
 local-user {{grpcUser}} password irreversible-cipher {{grpcUserPassword}}
 local-user {{grpcUser}} service-type http
 local-user {{grpcUser}} user-group manage-ug
 #### user account end
 #### bmc begin
 local-user inner_user_bmc password irreversible-cipher {{InerMgmtPassword}}
 local-user inner_user_bmc service-type telnet ssh
 local-user inner_user_bmc state block fail-times 3 interval 5
 local-user inner_user_bmc user-group manage-ug
 local-user inner_user_bmc password expire 0
 #### bmc end
stelnet server enable
snetconf server enable
sftp server enable
#
ssh client first-time enable
#
#### user account begin
ssh user {{sshLocalUser}}
ssh user {{sshLocalUser}} authentication-type password
ssh user {{sshLocalUser}} service-type sftp stelnet
ssh user {{sshLocalUser}} sftp-directory flash:
ssh user {{netconfUser}}
ssh user {{netconfUser}} authentication-type password
ssh user {{netconfUser}} service-type snetconf
ssh server-source -i MEth0/0/0
#### user account end
#### bmc begin
ssh user inner_user_bmc
ssh user inner_user_bmc authentication-type password
ssh user inner_user_bmc service-type all
ssh user inner_user_bmc source -i MEth0/0/1
ssh server-source -i MEth0/0/1
#### bmc end
#
ssh authentication-type default password
ssh authorization-type default aaa
#
ssh server cipher aes256_ctr aes128_ctr aes256_cbc aes128_cbc 3des_cbc blowfish_cbc
ssh server hmac sha2_256_96 sha2_256 sha1 sha1_96
ssh server key-exchange dh_group_exchange_sha256 dh_group_exchange_sha1 ecdh_sha2_nistp256 ecdh_sha2_nistp384 ecdh_sha2_nistp521 sm2_kep curve25519_sha256
#
ssh server publickey ecc rsa x509v3-ssh-rsa rsa_sha2_256 rsa_sha2_512
#
ssh server dh-exchange min-len 3072
undo ssh ipv6 server-source all-interface
#
netconf
 idle-timeout 0 0
 max-sessions 10
#
#### snmp begin
snmp-agent
snmp-agent sys-info contact wlip/core
snmp-agent sys-info location {{DeviceLocaion}}
snmp-agent sys-info version {{SNMPVersion}}
#
snmp-agent mib-view included nt iso
snmp-agent mib-view included rd iso
snmp-agent mib-view included wt iso
snmp-agent mib-view included iso-view iso
snmp-agent mib-view included iso iso
#
snmp-agent group v3 {{SNMPUserGroup}} privacy read-view rd write-view wt notify-view nt
#注意,配置SNCP 用户认证密码、加密密码，存在交互式密码配置
snmp-agent usm-user v3 {{SNMPUser}}
snmp-agent usm-user v3 {{SNMPUser}} group {{SNMPUserGroup}}
snmp-agent usm-user v3 {{SNMPUser}} {{SNMPUserGroup}} authentication-mode {{SNMPAuthenMode}} {{authKey}} privacy-mode {{SNMPPrivacyMode}} {{privKey}}
#
snmp-agent target-host host-name nms trap address udp-domain {{SNMPTargetHostIp}} vpn-instance NET-manage params securityname {{SNMPUser}} v3 privacy
#
snmp-agent trap source MEth0/0/0
snmp-agent protocol source-interface MEth0/0/0
#开启SNMP上报功能
snmp-agent trap enable
#关闭snmp使用IPV6上报
undo snmp-agent protocol source-status ipv6 all-interface
#### snmp end

#配置设备Console认证模式，登录超时时间10分钟0秒
user-interface console 0
 authentication-mode aaa
 idle-timeout 10 0
#配置VTY用户，最大登录用户数量，登录超时时间10分钟0秒
user-interface maximum-vty 20
#
user-interface vty 0 19
 authentication-mode aaa
 user privilege level 3
 idle-timeout 10 0
 protocol inbound ssh
#
#### radius begin
radius-server group shiva
 radius-server shared-key-cipher {{RadiusSharedKey}}
 radius-server authentication {{RadiusServerIp}} 1812 vpn-instance NET-manage
 radius-server authentication {{RadiusServerIpBack}} 1812 vpn-instance NET-manage secondary
 radius-server accounting {{RadiusServerIp}} 1813 vpn-instance NET-manage
 radius-server accounting {{RadiusServerIpBack}} 1813 vpn-instance NET-manage secondary
 radius-server retransmit 2
 undo radius-server user-name domain-included
#### radius end
#

#2、全局使能LLDP。
lldp enable
lldp management-address bind interface MEth0/0/0
#

#3、配置和分析器对接
#设备作为GRPC server
grpc
 grpc server
 source-ip {{MngIp}} vpn-instance NET-manage
  server-port 57400
  server enable
#
#### telemetry begin
telemetry
 sensor-group fabricdeviceandif
  sensor-path huawei-cpu-memory:cpu-memory/board-cpu-infos/board-cpu-info
  sensor-path huawei-cpu-memory:cpu-memory/board-memory-infos/board-memory-info
  sensor-path huawei-driver:driver/temperature2s/temperature2
  sensor-path openconfig-platform:components/component/fan/state
  sensor-path openconfig-platform:components/component/power-supply/state
  sensor-path huawei-ifm:ifm/interfaces/interface/mib-statistics
  sensor-path huawei-ifm:ifm/interfaces/interface/mib-statistics/huawei-ub-pic:ub-port-sts
 sensor-group fabricoptical
  sensor-path huawei-devm:devm/ports/port/huawei-ub-pic:optical-module
  depth 3

 destination-group fabricgroup
  ipv4-address {{telemetryDestIp}} port {{telemetryDestPort}} vpn-instance NET-manage protocol grpc no-tls

 subscription fabricsubscription
  local-source-address ipv4 {{MngIp}}
  sensor-group fabricdeviceandif sample-interval 60000
  sensor-group fabricoptical sample-interval 300000
  destination-group fabricgroup
#### telemetry end
#
#### info-center begin
info-center enable
info-center loghost {{SyslogServerIp}} vpn-instance NET-manage source-ip {{MngIp}} channel 6 port {{SyslogServerPort}} level debugging transport udp
undo info-center statistic-suppress enable
#### info-center end

