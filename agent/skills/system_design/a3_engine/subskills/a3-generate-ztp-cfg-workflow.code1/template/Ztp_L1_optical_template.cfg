bgp {{BGP_AS_NUM}}
  timer keepalive 120 hold 1800
 #
 vpn-instance ub-instance-0
  group ext0 unnumbered external
  peer ext0 unnumbered-interface 400GHL1/1/1:1
  peer ext0 unnumbered-interface 400GHL1/1/1:2
  peer ext0 unnumbered-interface 400GHL1/1/2:1
  peer ext0 unnumbered-interface 400GHL1/1/2:2
  peer ext0 unnumbered-interface 400GHL1/1/3:1
  peer ext0 unnumbered-interface 400GHL1/1/3:2
  peer ext0 unnumbered-interface 400GHL1/1/4:1
