[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oob-interconnect"
version = "1.2.0"
description = "LEAF–SPINE 互联规划离线工具（独立可运行包）"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "numpy>=1.24.0",
]

[project.scripts]
oob-interconnect = "oob_interconnect.cli:main"

[tool.setuptools]
packages = ["oob_interconnect"]
