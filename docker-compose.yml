# ============================================================
# AIDA · 231 容器编排（/home/aida）
# ============================================================
# 对外入口：https://aida.rnd.huawei.com（nginx-231-internal → aida-frontend:8080）
# 不映射 8080/8081/7401 到宿主机，避免与 /opt/aida_liwen 裸金属冲突。
# 可选调试：取消注释 frontend 的 ports 18080:8080（+10000 偏移）。
#
# 首次部署（231 上执行一次）：
#   mkdir -p /home/aida/agent
#   cp agent/.env.example /home/aida/agent/.env   # 填入 ZHIPU_API_KEY 等
#   # 编辑 agent/.env：DATA_CENTER_BASE_URL、AIDA_AGENT_BASE_URL（见 example 顶部说明）
#   docker compose up -d
# ============================================================

name: aida

services:
  agent:
    image: harbor.aie.rnd.huawei.com/aida/backend:latest
    container_name: aida-agent
    restart: unless-stopped
    env_file:
      - agent/.env.example
      - path: agent/.env
        required: false
    environment:
      AIDA_BUSINESS_ROOT: /app/.data/business
      AIDA_CHECKPOINT_DB: /app/.data/runtime/checkpoints.db
      AIDA_SOG_DATA_ROOT: /app/.data/sog-assets
      AIDA_SOG_PROBE_EVENTS: /app/.data/sog-probe-events.json
      AIDA_SOG_SCENES_PATH: /app/.data/sog-scenes.json
      ZHGK_ROOT: /app/.data/zhgk
    volumes:
      - aida-data:/app/.data
      - ./data/sog-assets:/app/.data/sog-assets
      - ./data/sog-scenes.json:/app/.data/sog-scenes.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aida-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7401/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager:
    image: harbor.aie.rnd.huawei.com/aida/manager:latest
    container_name: aida-manager
    restart: unless-stopped
    env_file:
      - agent/.env.example
      - path: agent/.env
        required: false
    environment:
      # 浏览器侧 Agent 入口（chat/access 回传）；经 nginx-backend → frontend 反代
      AIDA_AGENT_BASE_URL: https://aida.rnd.huawei.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aida-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: harbor.aie.rnd.huawei.com/aida/frontend:latest
    container_name: aida-frontend
    restart: unless-stopped
    # 正式流量走 nginx-231-internal；仅调试时取消下一行注释
    # ports:
    #   - "18080:8080"
    depends_on:
      agent:
        condition: service_healthy
      manager:
        condition: service_healthy
    networks:
      - aida-net
      - nginx-231-internal

volumes:
  aida-data:
    driver: local

networks:
  aida-net:
    driver: bridge
  nginx-231-internal:
    external: true
    name: nginx-231-internal
