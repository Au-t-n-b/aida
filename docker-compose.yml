# ============================================================
# AIDA · 231 Docker 编排（/home/aida）
# ============================================================
# 【231 宿主机端口 · 手动部署已占用 · Docker 禁止 bind 这些端口】
#   AIDA 前端 8080 | Manager 8081 | Agent 7401
#   数据中心前端 5173 | 数据中心后端 8000
# 容器内仍可用 8080/8081/7401（仅 aida-net 内网 DNS），与宿主机不冲突。
#
# 对外入口：https://aida.rnd.huawei.com
#   nginx-backend（nginx-internal）→ aida-frontend:8080（容器内，非宿主机 8080）
#   frontend 容器内再反代 manager:8081 / agent:7401（均不暴露宿主机）
# 宿主机不映射 8080/8081/7401；可选调试 ports: "18080:8080"（+10000 偏移）。
# 访问宿主机数据中心 API：agent/.env 设 DATA_CENTER_BASE_URL=http://host.docker.internal:8000
#
# 首次：mkdir -p /home/aida/agent /home/aida/logs/agent && 配置 agent/.env
# 日志：stdout → Docker json-file（单容器 max 50m×5）；agent 文件日志 → ./logs/agent
# 启动：docker compose up -d
# ============================================================

name: aida

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  agent:
    image: harbor.aie.rnd.huawei.com/aida/backend:latest
    container_name: aida-agent
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - agent/.env.example
      - path: agent/.env
        required: false
    environment:
      AIDA_BUSINESS_ROOT: /app/.data/business
      AIDA_CHECKPOINT_DB: /app/.data/runtime/checkpoints.db
      AIDA_SOG_DATA_ROOT: /app/.data/sog-assets
      AIDA_SOG_PROBE_EVENTS: /app/.data/sog-probe-events.json
      AIDA_SOG_SCENES_PATH: /app/.data/sog-scenes.json
      ZHGK_ROOT: /app/.data/zhgk
      AIDA_LOG_DIR: /app/logs
    volumes:
      - aida-data:/app/.data
      - ./logs/agent:/app/logs
      - ./data/sog-assets:/app/.data/sog-assets
      - ./data/sog-scenes.json:/app/.data/sog-scenes.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aida-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7401/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager:
    image: harbor.aie.rnd.huawei.com/aida/manager:latest
    container_name: aida-manager
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - agent/.env.example
      - path: agent/.env
        required: false
    environment:
      # 浏览器侧 Agent 入口（chat/access 回传）；经 nginx-backend → frontend 反代
      AIDA_AGENT_BASE_URL: https://aida.rnd.huawei.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aida-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: harbor.aie.rnd.huawei.com/aida/frontend:latest
    container_name: aida-frontend
    restart: unless-stopped
    logging: *default-logging
    # 正式流量走 nginx-internal；仅调试时取消下一行注释
    # ports:
    #   - "18080:8080"
    depends_on:
      agent:
        condition: service_healthy
      manager:
        condition: service_healthy
    networks:
      - aida-net
      - nginx-internal

volumes:
  aida-data:
    driver: local

networks:
  aida-net:
    driver: bridge
  nginx-internal:
    external: true
    name: nginx-internal
