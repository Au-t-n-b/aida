<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIDA · 登录</title>
<style>
  :root {
    --bg-1: #f5f8fd;
    --bg-2: #e9f0fa;
    --bg-3: #dfe9f6;
    --ink: #16233c;
    --ink-soft: #46566f;
    --ink-faint: #8a99b5;
    --ink-ghost: #aeb9cd;
    --blue: #2f7df6;
    --blue-deep: #1d5fd0;
    --cyan: #19b8d8;
    --line: rgba(120, 160, 220, 0.30);
    --glass: rgba(255, 255, 255, 0.66);
    --glass-strong: rgba(255, 255, 255, 0.82);
    --glass-border: rgba(140, 175, 230, 0.42);
    --shadow: 0 30px 80px -32px rgba(38, 86, 160, 0.50);
    --shadow-sm: 0 12px 34px -18px rgba(38, 86, 160, 0.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1300px 850px at 26% 14%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(1200px 980px at 86% 92%, #eef4ff 0%, rgba(238,244,255,0) 60%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 46%, var(--bg-3) 100%);
  }

  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* masked technical grid */
  #stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(70,120,200,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70,120,200,0.055) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(closest-side at 38% 50%, #000 30%, transparent 88%);
    -webkit-mask-image: radial-gradient(closest-side at 38% 50%, #000 30%, transparent 88%);
  }

  canvas#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ===================== Top bar ===================== */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 42px; pointer-events: none;
    opacity: 0;
  }
  body.s4 .topbar { animation: fadeIn .9s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .brand { display: flex; align-items: center; gap: 13px; pointer-events: auto; }
  .brand .mark {
    width: 38px; height: 38px; display: grid; place-items: center;
    border-radius: 11px; background: linear-gradient(150deg, #ffffff, #eaf2ff);
    border: 1px solid rgba(140,175,230,0.5); box-shadow: var(--shadow-sm);
  }
  .brand .mark svg { width: 22px; height: 22px; }
  .brand .lockup .twm { display: block; height: 17px; color: var(--ink); }
  .brand .lockup .twm svg { height: 100%; width: auto; display: block; }
  .brand .lockup .sub { display:block; font-size: 10px; color: var(--ink-faint); letter-spacing: 2.4px; text-transform: uppercase; margin-top: 5px; }

  .status-pill {
    display: flex; align-items: center; gap: 9px; pointer-events: auto;
    background: var(--glass); border: 1px solid var(--glass-border);
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; color: var(--ink-soft); letter-spacing: .4px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow-sm);
    opacity: 0;
  }
  body.s4 .status-pill { animation: fadeIn .9s ease forwards; }
  .status-pill i {
    width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 0 0 rgba(25,184,216,0.5); animation: pulse 1.9s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(25,184,216,0.42); }
    70% { box-shadow: 0 0 0 9px rgba(25,184,216,0); }
    100% { box-shadow: 0 0 0 0 rgba(25,184,216,0); }
  }

  /* ===================== Layout ===================== */
  .scene {
    position: absolute; inset: 0; z-index: 20;
    display: grid; grid-template-columns: 1.18fr 0.82fr; align-items: center;
  }

  /* ---------- Left: brand presence ---------- */
  .hero { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 calc(100vw / 8); }

  /* restrained brand-film entrance */
  .brand-intro {
    position: absolute; left: 50%; top: 50%; z-index: 34; pointer-events: none;
    width: min(760px, 74vw); height: min(248px, 24vw);
    --gateway-x: 158%;
    --gateway-y: -31%;
    --gateway-scale: 4.15;
    transform: translate(-50%, -50%);
    opacity: 1; visibility: visible;
    transition: opacity .35s ease, visibility 0s linear .35s;
  }
  .brand-intro::before {
    content: ""; position: absolute; left: 50%; top: 51%; width: 52vw; height: 18vw;
    max-width: 720px; max-height: 260px; min-width: 300px; min-height: 120px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(47,125,246,0.16), rgba(25,184,216,0.07) 42%, transparent 74%);
    transform: translate(-50%, -50%) scale(.82);
    opacity: 0; filter: blur(18px);
  }
  body.s1 .brand-intro::before { animation: introGlow 2.3s cubic-bezier(.22,.75,.22,1) forwards; }
  .brand-copy, .brand-motion-logo {
    position: absolute; top: 50%; display: block; pointer-events: none;
    user-select: none;
  }
  .brand-copy {
    left: 50%; width: 100%; height: auto;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.965);
    filter: blur(10px) drop-shadow(0 24px 54px rgba(38,86,160,0.12));
    transition:
      opacity .92s cubic-bezier(.36,0,.2,1),
      transform .92s cubic-bezier(.36,0,.2,1),
      filter .92s cubic-bezier(.36,0,.2,1);
  }
  .brand-motion-logo {
    left: 2.6%; width: 32.7%; height: auto;
    opacity: 0;
    transform: translateY(-50%) scale(1);
    transform-origin: center;
    filter: blur(4px) drop-shadow(0 18px 38px rgba(38,86,160,0.14));
  }
  body.s1 .brand-copy {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    filter: blur(0) drop-shadow(0 24px 54px rgba(38,86,160,0.12));
  }
  body.s1 .brand-motion-logo {
    opacity: 1;
    filter: blur(0) drop-shadow(0 18px 38px rgba(38,86,160,0.14));
  }
  body.s3 .brand-copy { animation: brandCopyOut .72s cubic-bezier(.36,0,.2,1) forwards; }
  body.s3 .brand-motion-logo { animation: logoToBackground 1.85s cubic-bezier(.36,0,.2,1) forwards; }
  body.s4 .brand-intro { z-index: 1; }
  body.s4 .brand-copy { opacity: 0; }

  @keyframes introGlow {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.72); filter: blur(26px); }
    45% { opacity: .78; }
    100% { opacity: .42; transform: translate(-50%, -50%) scale(1); filter: blur(18px); }
  }
  @keyframes brandCopyOut {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0) saturate(1) contrast(1) drop-shadow(0 24px 54px rgba(38,86,160,0.12)); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); filter: blur(10px) saturate(.72) contrast(.78) drop-shadow(0 8px 18px rgba(38,86,160,0.04)); }
  }
  @keyframes logoToBackground {
    0% { opacity: 1; transform: translateY(-50%) scale(1); filter: blur(0) saturate(1) contrast(1) drop-shadow(0 18px 38px rgba(38,86,160,0.14)); }
    18% { opacity: 1; transform: translateY(-50%) scale(1); filter: blur(0) saturate(1) contrast(1) drop-shadow(0 18px 38px rgba(38,86,160,0.18)); }
    58% { opacity: .44; filter: blur(4px) saturate(.82) contrast(.88) drop-shadow(0 8px 18px rgba(38,86,160,0.08)); }
    100% { opacity: .10; transform: translate(var(--gateway-x), var(--gateway-y)) scale(var(--gateway-scale)); filter: blur(0) saturate(.62) contrast(.78) drop-shadow(0 0 0 rgba(38,86,160,0)); }
  }
  .hero-inner { position: relative; z-index: 2; max-width: 820px; opacity: 0; transform: translateY(22px); }
  body.s4 .hero-inner { animation: rise 1.05s cubic-bezier(.22,.75,.22,1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

  .hero-logo { display: flex; align-items: center; gap: 24px; margin-bottom: 40px; }
  .hero-logo .glyph { width: 72px; height: 72px; flex: none; }
  .hero-logo .wm { height: 100px; }
  .hero-logo .wm svg { height: 100%; width: auto; display: block; color: var(--ink); }

  .hero-tagline {
    font-size: 17px; letter-spacing: 6.5px; text-transform: uppercase;
    color: var(--blue); font-weight: 700; margin-bottom: 20px;
  }
  .hero-h1 { font-size: 58px; font-weight: 800; line-height: 1.22; letter-spacing: .5px; color: var(--ink); margin-bottom: 24px; text-wrap: balance; }
  .hero-h1 em { font-style: normal; color: var(--blue-deep); }
  .hero-sub { font-size: 15px; line-height: 1.75; color: var(--ink-soft); max-width: 460px; text-wrap: pretty; }

  .hero-meta { display: flex; gap: 30px; margin-top: 38px; }
  .hero-meta .m { display: flex; flex-direction: column; gap: 5px; }
  .hero-meta .m b { font-size: 21px; font-weight: 800; color: var(--ink); letter-spacing: .5px; }
  .hero-meta .m span { font-size: 11.5px; color: var(--ink-faint); letter-spacing: 1.5px; }
  .hero-meta .div { width: 1px; background: linear-gradient(var(--line), transparent); }

  /* ---------- Right: login card ---------- */
  .auth-wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 84px 0 24px; }
  .auth {
    position: relative; width: 100%; max-width: 396px;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    border-radius: 24px; padding: 40px 38px 34px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    opacity: 0; transform: translateY(22px);
  }
  body.s4 .auth { animation: rise 1.05s cubic-bezier(.22,.75,.22,1) forwards; }
  .auth::before {
    content: ""; position: absolute; inset: 0; border-radius: 24px; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,0.6), rgba(255,255,255,0) 40%);
  }
  .auth-head { position: relative; margin-bottom: 26px; }
  .auth-head .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--blue); font-weight: 700; }
  .auth-head h2 { font-size: 25px; font-weight: 800; letter-spacing: .5px; margin-top: 9px; color: var(--ink); }
  .auth-head p { font-size: 12.5px; color: var(--ink-faint); margin-top: 7px; letter-spacing: .3px; }

  .field { position: relative; margin-bottom: 16px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: 1px; margin-bottom: 8px; }
  .field .inp {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.7); border: 1px solid rgba(120,150,200,0.32);
    border-radius: 13px; padding: 0 14px; height: 48px;
    transition: border-color .22s ease, box-shadow .22s ease, background .22s ease;
  }
  .field .inp:focus-within { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(47,125,246,0.12); }
  .field .inp svg { width: 17px; height: 17px; color: var(--ink-faint); flex: none; }
  .field input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14.5px; color: var(--ink); letter-spacing: .3px; font-family: inherit;
  }
  .field input::placeholder { color: var(--ink-ghost); }
  .field .toggle { cursor: pointer; color: var(--ink-faint); display: grid; place-items: center; }
  .field .toggle:hover { color: var(--ink-soft); }

  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 22px; }
  .remember { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; color: var(--ink-soft); user-select: none; }
  .remember .box {
    width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid rgba(120,150,200,0.55);
    display: grid; place-items: center; transition: all .2s ease; background: rgba(255,255,255,0.6);
  }
  .remember .box svg { width: 11px; height: 11px; color: #fff; opacity: 0; transform: scale(.5); transition: all .2s ease; }
  .remember.on .box { background: var(--blue); border-color: var(--blue); }
  .remember.on .box svg { opacity: 1; transform: scale(1); }
  .link { font-size: 12.5px; color: var(--blue); font-weight: 600; cursor: pointer; letter-spacing: .3px; }
  .link:hover { color: var(--blue-deep); }

  .btn-primary {
    width: 100%; height: 50px; border: none; cursor: pointer;
    border-radius: 13px; color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 3px;
    font-family: inherit;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
    box-shadow: 0 16px 34px -14px rgba(29,95,208,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 22px 44px -14px rgba(29,95,208,0.8), inset 0 1px 0 rgba(255,255,255,0.35); }
  .btn-primary:active { transform: translateY(0); filter: brightness(.97); }
  .btn-primary svg { width: 17px; height: 17px; }

  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 18px; color: var(--ink-faint); font-size: 11px; letter-spacing: 1.5px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(120,150,200,0.25); }

  .btn-sso {
    width: 100%; height: 46px; cursor: pointer; font-family: inherit;
    border-radius: 12px; border: 1px solid rgba(120,150,200,0.34);
    background: rgba(255,255,255,0.55); color: var(--ink-soft);
    font-size: 13.5px; font-weight: 600; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all .2s ease;
  }
  .btn-sso:hover { background: #fff; border-color: var(--blue); color: var(--blue-deep); box-shadow: var(--shadow-sm); }
  .btn-sso svg { width: 16px; height: 16px; color: var(--blue); }

  .auth-foot { margin-top: 22px; text-align: center; font-size: 11.5px; color: var(--ink-faint); letter-spacing: .4px; line-height: 1.7; }
  .auth-foot b { color: var(--ink-soft); font-weight: 600; }

  @media (max-width: 1080px) {
    .scene { grid-template-columns: 1fr; }
    .hero { display: none; }
    .auth-wrap { padding: 0 24px; }
    #stage::before { mask-image: radial-gradient(closest-side at 50% 42%, #000 30%, transparent 88%); -webkit-mask-image: radial-gradient(closest-side at 50% 42%, #000 30%, transparent 88%); }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>

  <!-- film-style brand entrance: text dissolves while the same logo becomes the ambient background -->
  <div class="brand-intro" aria-hidden="true">
    <svg class="brand-copy" viewBox="0 0 1248 408" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(504 30) scale(1.69)" fill="#09245F">
        <polygon points="0,120 42.658,36.574 57.342,36.574 100,120 86.522,120 50,48.574 13.478,120"/>
        <rect x="135.502" y="36.574" width="12" height="83.426"/>
        <g transform="translate(183.004, 36.574) scale(0.05212822)">
          <path fill-rule="evenodd" d="M 0 0 H 1262.4 A 800.2 800.2 0 0 1 1262.4 1600.4 H 0 Z M 230.202 230.202 V 1370.198 H 1262.4 A 569.998 569.998 0 0 0 1262.4 230.202 H 230.202 Z"/>
        </g>
        <polygon transform="translate(310.524, 0)" points="0,120 42.658,36.574 57.342,36.574 100,120 86.522,120 50,48.574 13.478,120"/>
      </g>
      <text
        x="504"
        y="306"
        fill="#2F3E5D"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="35"
        font-weight="300"
        letter-spacing="0.8"
        textLength="699"
        lengthAdjust="spacingAndGlyphs">Agentic Integrated Delivery Architecture</text>
      <line x1="504" y1="354" x2="610" y2="354" stroke="#D5DBE6" stroke-width="2"/>
      <text
        x="637"
        y="363"
        fill="#7F8CA3"
        font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif"
        font-size="27"
        font-weight="500"
        letter-spacing="20">智能体集成交付架构</text>
      <line x1="1096" y1="354" x2="1202" y2="354" stroke="#D5DBE6" stroke-width="2"/>
    </svg>
    <img class="brand-motion-logo" src="/login-gateway/assets/aida-logo-mark.svg" alt="" />
  </div>

  <!-- top bar -->
  <div class="topbar">
    <div class="status-pill"><i></i> 平台运行中 · 安全接入</div>
  </div>

  <!-- main scene -->
  <div class="scene">
    <!-- left hero -->
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-logo">
          <div class="wm">
            <svg viewBox="0 0 410.524 120" xmlns="http://www.w3.org/2000/svg">
              <polygon fill="currentColor" points="0,120 42.658,36.574 57.342,36.574 100,120 86.522,120 50,48.574 13.478,120"></polygon>
              <rect x="135.502" y="36.574" width="12" height="83.426" fill="currentColor"></rect>
              <g transform="translate(183.004, 36.574) scale(0.05212822)">
                <path fill="currentColor" fill-rule="evenodd" d="M 0 0 H 1262.4 A 800.2 800.2 0 0 1 1262.4 1600.4 H 0 Z M 230.202 230.202 V 1370.198 H 1262.4 A 569.998 569.998 0 0 0 1262.4 230.202 H 230.202 Z"></path>
              </g>
              <polygon fill="currentColor" transform="translate(310.524, 0)" points="0,120 42.658,36.574 57.342,36.574 100,120 86.522,120 50,48.574 13.478,120"></polygon>
            </svg>
          </div>
        </div>

        <div class="hero-tagline">Agentic Integrated Delivery Arena</div>
        <h1 class="hero-h1">算力<em>智能交付</em>中枢</h1>
      </div>
    </div>

    <!-- right auth -->
    <div class="auth-wrap">
      <form class="auth" id="authForm" autocomplete="off">
        <div class="auth-head">
          <div class="eyebrow">Sign in</div>
          <h2>登录工作台</h2>
          <p>使用企业账号接入 AIDA 交付编排平台</p>
        </div>

        <div class="field">
          <label>账号</label>
          <div class="inp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="user" placeholder="工号 / 企业邮箱" autocomplete="off" />
          </div>
        </div>

        <div class="field">
          <label>密码</label>
          <div class="inp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="pwd" placeholder="请输入密码" autocomplete="off" />
            <span class="toggle" id="pwdToggle" title="显示 / 隐藏">
              <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>
        </div>

        <div class="row">
          <div class="remember on" id="remember">
            <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
            保持登录
          </div>
          <span class="link">忘记密码？</span>
        </div>

        <button type="submit" class="btn-primary">
          进入平台
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>

        <div class="divider">或</div>

        <button type="button" class="btn-sso" id="ssoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v5c0 5 3.8 8.5 9 10 5.2-1.5 9-5 9-10V7l-9-5z"></path></svg>
          企业统一身份认证 (SSO)
        </button>

        <div class="auth-foot">
          受 <b>统一身份</b> 与 <b>访问审计</b> 保护 · 内部系统，请勿外传
        </div>
      </form>
    </div>
  </div>
</div>

<script>
/* ============ entrance timeline ============ */
(function () {
  const body = document.body;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function run() {
    if (reduce) { body.classList.add("s1", "s3", "s4"); return; }
    requestAnimationFrame(() => {
      body.classList.add("s1");                                  // split brand lockup quietly appears
      setTimeout(() => body.classList.add("s3"), 1450);          // text dissolves while the same logo becomes background
      setTimeout(() => body.classList.add("s4"), 3000);          // left headline + right login rise in
    });
  }
  if (document.readyState === "complete") run();
  else window.addEventListener("load", run);
})();

/* ============ particle field ============ */
(function () {
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  const TAU = Math.PI * 2;
  let particles = [];
  const mouse = { x: -9999, y: -9999 };
  const interaction = { focus: 0, targetFocus: 0, pulse: 0, pulseX: 0, pulseY: 0, release: 0 };
  let authRect = null;

  function syncFieldState() {
    document.documentElement.dataset.fieldFocus = interaction.focus.toFixed(3);
    document.documentElement.dataset.fieldTargetFocus = String(interaction.targetFocus);
    document.documentElement.dataset.fieldPulse = interaction.pulse.toFixed(3);
    document.documentElement.dataset.fieldRelease = interaction.release.toFixed(3);
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const target = Math.round((W * H) / 16000);
    const count = Math.max(48, Math.min(120, target));
    particles = [];
    for (let i = 0; i < count; i++) particles.push(mk());
  }

  function mk() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 2.24,
      vy: (Math.random() - 0.5) * 2.24,
      r: Math.random() * 1.6 + 0.7,
      glow: Math.random() < 0.22,
      drift: Math.random() * TAU,
      focusAngle: Math.random() * TAU,
      focusRadius: Math.sqrt(Math.random())
    };
  }

  function updateAuthRect() {
    const auth = document.querySelector(".auth");
    if (!auth) return;
    const rect = auth.getBoundingClientRect();
    authRect = rect.width > 0 && rect.height > 0 ? rect : null;
  }

  function tone(t) {
    // blend blue -> cyan
    const a = [47, 125, 246], b = [25, 184, 216];
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  const LINK = 132;
  function frame() {
    ctx.clearRect(0, 0, W, H);
    const focusEase = interaction.targetFocus ? 0.045 : 0.115;
    interaction.focus += (interaction.targetFocus - interaction.focus) * focusEase;
    interaction.pulse *= 0.93;
    interaction.release *= 0.86;
    syncFieldState();
    updateAuthRect();

    for (const p of particles) {
      p.drift += 0.006;
      const quiet = 1 - interaction.focus * 0.38;
      const speed = Math.hypot(p.vx, p.vy);
      if (speed > 1.9) {
        const damp = 0.82 + interaction.release * 0.04;
        p.vx *= damp;
        p.vy *= damp;
      }
      p.x += (p.vx + Math.cos(p.drift) * 0.05) * quiet;
      p.y += (p.vy + Math.sin(p.drift) * 0.05) * quiet;

      // focus convergence: particles gather behind the login card
      if (authRect && interaction.focus > 0.02) {
        const cx = authRect.left + authRect.width * 0.5;
        const cy = authRect.top + authRect.height * 0.5;
        const orbital = p.focusAngle + Math.sin(p.drift * 0.7) * 0.22;
        const rx = authRect.width * (0.18 + p.focusRadius * 0.44);
        const ry = authRect.height * (0.16 + p.focusRadius * 0.38);
        const tx = cx + Math.cos(orbital) * rx;
        const ty = cy + Math.sin(orbital) * ry;
        const pull = 0.012 + interaction.focus * 0.038;
        p.x += (tx - p.x) * pull;
        p.y += (ty - p.y) * pull;
      }

      // pointer magnetic field
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 26000) {
        const f = (26000 - d2) / 26000 * 0.82;
        const d = Math.sqrt(d2) || 1;
        p.x += (dx / d) * f; p.y += (dy / d) * f;
      }

      // login card safety field
      if (authRect && interaction.focus < 0.18) {
        const cx = authRect.left + authRect.width * 0.5;
        const cy = authRect.top + authRect.height * 0.5;
        const rx = authRect.width * 0.72;
        const ry = authRect.height * 0.60;
        const ax = (p.x - cx) / rx;
        const ay = (p.y - cy) / ry;
        const n = ax * ax + ay * ay;
        if (n < 1.45) {
          const d = Math.sqrt(n) || 0.001;
          const push = (1.45 - n) * 0.42 * (1 - interaction.focus);
          p.x += (ax / d) * push;
          p.y += (ay / d) * push;
        }
      }

      // short authentication convergence feedback
      if (interaction.pulse > 0.01) {
        const px = interaction.pulseX - p.x;
        const py = interaction.pulseY - p.y;
        const dist = Math.hypot(px, py);
        if (dist < 520) {
          const pull = (1 - dist / 520) * interaction.pulse * 1.6;
          p.x += (px / (dist || 1)) * pull;
          p.y += (py / (dist || 1)) * pull;
        }
      }

      // focus release: push particles back out from behind the card
      if (authRect && interaction.release > 0.01) {
        const cx = authRect.left + authRect.width * 0.5;
        const cy = authRect.top + authRect.height * 0.5;
        const ox = p.x - cx;
        const oy = p.y - cy;
        const dist = Math.hypot(ox, oy) || 1;
        const range = Math.max(authRect.width, authRect.height) * 1.15;
        if (dist < range) {
          const push = (1 - dist / range) * interaction.release * 24;
          p.x += (ox / dist) * push;
          p.y += (oy / dist) * push;
          p.vx += (ox / dist) * interaction.release * 0.18;
          p.vy += (oy / dist) * interaction.release * 0.18;
        }
      }

      if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
    }

    // links
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const dist = Math.hypot(dx, dy);
        if (dist < LINK) {
          const nearMouse = Math.min(Math.hypot(p.x - mouse.x, p.y - mouse.y), Math.hypot(q.x - mouse.x, q.y - mouse.y));
          const mouseLift = nearMouse < 180 ? (1 - nearMouse / 180) * 0.24 : 0;
          const pulseLift = interaction.pulse > 0.01 ? interaction.pulse * 0.10 : 0;
          const a = (1 - dist / LINK) * (0.28 + mouseLift + pulseLift) * (1 - interaction.focus * 0.36);
          const c = tone((p.x / W));
          ctx.strokeStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
    }

    // dots
    for (const p of particles) {
      const c = tone(p.x / W);
      let shield = 1;
      if (authRect && interaction.focus < 0.18) {
        const cx = authRect.left + authRect.width * 0.5;
        const cy = authRect.top + authRect.height * 0.5;
        const n = Math.pow((p.x - cx) / (authRect.width * 0.66), 2) + Math.pow((p.y - cy) / (authRect.height * 0.56), 2);
        if (n < 1.25) shield = 0.38 + n * 0.42;
      }
      const calm = 1 - interaction.focus * 0.12;
      const gatherLift = interaction.focus * 0.22;
      const pulseGlow = interaction.pulse > 0.01 ? interaction.pulse * 0.28 : 0;
      if (p.glow) {
        const gr = p.r * (6 + gatherLift * 10 + pulseGlow * 8);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
        g.addColorStop(0, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (0.5 + gatherLift + pulseGlow) * calm * shield + ")");
        g.addColorStop(1, "rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, gr, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (0.78 * calm * shield + gatherLift + pulseGlow) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      if (p.glow) {
        ctx.fillStyle = "rgba(255,255,255," + 0.9 * calm * shield + ")";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, TAU); ctx.fill();
      }
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener("mouseleave", () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener("aida:field-calm", e => { interaction.targetFocus = e.detail && e.detail.active ? 1 : 0; });
  window.addEventListener("aida:field-release", () => {
    if (!interaction.targetFocus && interaction.focus < 0.08) return;
    interaction.targetFocus = 0;
    interaction.release = 1;
    interaction.focus = Math.min(interaction.focus, 0.72);
    syncFieldState();
  });
  window.addEventListener("aida:field-pulse", e => {
    interaction.pulse = 1;
    interaction.pulseX = e.detail && Number.isFinite(e.detail.x) ? e.detail.x : W * 0.72;
    interaction.pulseY = e.detail && Number.isFinite(e.detail.y) ? e.detail.y : H * 0.5;
    syncFieldState();
  });
  window.addEventListener("resize", () => { clearTimeout(window.__rt); window.__rt = setTimeout(resize, 150); });
  window.__aidaParticleField = interaction;
  resize();
  requestAnimationFrame(frame);
})();

/* ============ form interactions ============ */
(function () {
  const remember = document.getElementById("remember");
  remember.addEventListener("click", () => remember.classList.toggle("on"));

  const pwd = document.getElementById("pwd");
  const authForm = document.getElementById("authForm");
  authForm.addEventListener("focusin", e => {
    if (e.target && e.target.matches(".field input")) {
      window.dispatchEvent(new CustomEvent("aida:field-calm", { detail: { active: true } }));
    }
  });
  authForm.addEventListener("focusout", () => {
    setTimeout(() => {
      if (!authForm.querySelector(".field input:focus")) {
        window.dispatchEvent(new CustomEvent("aida:field-release"));
      }
    }, 0);
  });
  document.addEventListener("mousedown", e => {
    const field = window.__aidaParticleField;
    if (!field) return;
    if ((!e.target || !e.target.matches(".field input")) && (field.targetFocus || field.focus > 0.08)) {
      window.dispatchEvent(new CustomEvent("aida:field-release"));
    }
  });

  const toggle = document.getElementById("pwdToggle");
  const eye = document.getElementById("eye");
  toggle.addEventListener("click", () => {
    const show = pwd.type === "password";
    pwd.type = show ? "text" : "password";
    eye.innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  });

  const user = document.getElementById("user");
  const ssoBtn = document.getElementById("ssoBtn");
  const btnPrimaryHtml = '<span>进入平台</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';

  function postLogin(account, password) {
    window.parent.postMessage({ type: "aida-gateway-login", account, password }, "*");
  }

  function setSubmitting(active) {
    const btn = authForm.querySelector(".btn-primary");
    if (!btn) return;
    btn.style.pointerEvents = active ? "none" : "";
    btn.innerHTML = active ? "验证中…" : btnPrimaryHtml;
  }

  window.addEventListener("message", e => {
    const data = e.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "aida-gateway-login-reset") setSubmitting(false);
    if (data.type === "aida-gateway-login-error") {
      setSubmitting(false);
      if (data.message) alert(String(data.message));
    }
  });

  if (ssoBtn) {
    ssoBtn.addEventListener("click", () => postLogin("sso@aida.cloud", ""));
  }

  authForm.addEventListener("submit", e => {
    e.preventDefault();
    const account = user.value.trim();
    const password = pwd.value;
    if (!account || !password) {
      alert("请输入账号和密码");
      return;
    }
    const btn = e.target.querySelector(".btn-primary");
    const rect = btn.getBoundingClientRect();
    window.dispatchEvent(new CustomEvent("aida:field-pulse", {
      detail: { x: rect.left + rect.width * 0.5, y: rect.top + rect.height * 0.5 }
    }));
    setSubmitting(true);
    postLogin(account, password);
  });
})();
</script>
</body>
</html>
